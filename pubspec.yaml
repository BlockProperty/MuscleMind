name: musclemind_app
description: "MuscleMind – Massage Therapy Learning & OSCE Simulation App"
publish_to: "none"

version: 1.0.2+8

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6

  # State management / Routing
  flutter_riverpod: ^3.3.2
  go_router: ^17.1.0

  # Audio
  just_audio: ^0.10.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Google Play Billing Library 8
  in_app_purchase: ^3.3.0
  in_app_purchase_android: 0.5.0

  # Utilities
  uuid: ^4.5.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/logo/

flutter_native_splash:
  color: "#08111f"
  image: assets/logo/musclemind_splash.png
  android: true
  ios: true
  web: false

  android_12:
    color: "#08111f"
    image: assets/logo/musclemind_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/musclemind_icon.png
  adaptive_icon_background: "#08111f"
  adaptive_icon_foreground: assets/logo/musclemind_icon.png
  remove_alpha_ios: true